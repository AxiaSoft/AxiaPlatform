<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <meta name="description" content="The requested AXIASOFT page could not be found.">
  <meta name="robots" content="noindex">
  <title>Page not found — AXIASOFT</title>
  <link rel="stylesheet" href="/AxiaPlatform/styles.css?v=fa-font-vazirmatn-2">
  <link rel="stylesheet" href="/AxiaPlatform/effects.css?v=fx-2">
  <style>
    .notfound{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:60px 0}
    .notfound-inner{text-align:center;max-width:560px}
    .notfound-code{font-size:clamp(72px,18vw,150px);font-weight:600;letter-spacing:-.06em;line-height:1;margin:0;
      background:linear-gradient(110deg,#8bc3ff 8%,#438fff 55%,#b2a5ff 100%);background-clip:text;-webkit-background-clip:text;color:transparent}
    .notfound h1{font-size:clamp(24px,4vw,34px);font-weight:560;letter-spacing:-.03em;margin:10px 0 12px}
    .notfound p{color:var(--muted);font-size:14px;line-height:1.8;margin:0 auto 26px;max-width:430px}
    .notfound-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  </style>
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <header class="topbar">
    <a href="/" class="brand" aria-label="AXIASOFT home">
      <span class="brand-mark"><img src="/AxiaPlatform/brand/axiasoft-original.png" alt="AXIASOFT original symbol"></span>
      <img class="brand-wordmark" src="/AxiaPlatform/brand/axiasoft-wordmark.png" alt="AXIASOFT wordmark">
    </a>
    <div class="nav-actions">
      <a class="button button-small button-primary" href="/">Return home <span>↗</span></a>
    </div>
  </header>
  <main>
    <div class="container notfound">
      <div class="notfound-inner">
        <p class="notfound-code">404</p>
        <h1>This page isn't here.</h1>
        <p>The address may have changed, or the link may be mistyped. Everything AXIASOFT publishes lives behind the links below.</p>
        <div class="notfound-actions">
          <a class="button button-primary" href="/">Go to the homepage</a>
          <a class="button button-quiet" href="/AxiaPlatform/#/products">Browse products</a>
          <a class="button button-quiet" href="/AxiaPlatform/#/contact">Start a project</a>
        </div>
      </div>
    </div>
  </main>
  <script src="/AxiaPlatform/effects.js?v=fx-2" defer></script>
</body>
</html>
